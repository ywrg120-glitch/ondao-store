name: Executar Agentes Ondao

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  run-gemini-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Agents Logic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, glob
          from google import genai

          client = genai.Client()

          files = glob.glob('config-ondao.md')
          contexto = ''
          if files:
              with open(files[0], 'r', encoding='utf-8') as f:
                  contexto = f.read()

          print(f'Contexto carregado: {len(contexto)} carateres')

          prompt = f'''
          Com base nas diretrizes da marca em anexo:
          {contexto}
          
          Atua como um especialista em copywriting D2C e desenvolvimento web minimalista (estilo Wavy).
          Gera o código HTML/Tailwind CSS para a Hero Section com a headline \"Assuma as suas ondas.\", 
          com foco visual no creme/frasco terracota, zero ruído visual, elegante e com alta conversão.
          '''

          # Lista de modelos a testar por ordem de preferência
          modelos = ['gemini-2.0-flash', 'gemini-1.5-flash-8b', 'gemini-1.5-pro']
          
          response = None
          for m in modelos:
              try:
                  print(f'A tentar gerar com o modelo: {m}...')
                  response = client.models.generate_content(
                      model=m,
                      contents=prompt
                  )
                  print(f'Sucesso com o modelo: {m}')
                  break
              except Exception as e:
                  print(f'Falha ao tentar {m}: {e}')

          if response:
              print('--- RESPOSTA DOS AGENTES (HERO SECTION) ---')
              print(response.text)
          else:
              raise RuntimeError('Nenhum modelo Gemini respondeu com sucesso.')
          "
