name: Executar Agentes Ondao

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  run-gemini-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Agents Logic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python -c "
          import os, glob
          from google import genai

          client = genai.Client()

          # Procurar o ficheiro room-config na raiz
          files = glob.glob('room-config.md')
          contexto = ''
          if files:
              with open(files[0], 'r', encoding='utf-8') as f:
                  contexto = f.read()

          print(f'Contexto carregado com sucesso da raiz: {len(contexto)} carateres')
          "
