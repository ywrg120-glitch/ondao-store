name: Executar Agentes Ondao

on:
  issues:
    types: [opened, labeled]

jobs:
  run-gemini-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Agents Logic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python -c "
          import os, glob
          from google import genai

          client = genai.Client()
          
          # Procurar o ficheiro room-config dentro da pasta agentes
          files = glob.glob('agentes/*room-config*.md')
          contexto = ''
          if files:
              with open(files[0], 'r', encoding='utf-8') as f:
                  contexto = f.read()

          prompt = f'''
          Tu és a equipa de 7 agentes autónomos da Ondão Store.
          Com base nas tuas diretrizes:
          {contexto}

          Trabalha na seguinte tarefa aberta no GitHub:
          Título: {os.environ.get('ISSUE_TITLE')}
          Descrição: {os.environ.get('ISSUE_BODY')}

          Gera um plano de ação detalhado, o código necessário e as recomendações de conversão inspiradas na Wavy.
          '''

          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt,
          )

          print('--- RESPOSTA DOS AGENTES ---')
          print(response.text)
          "
