name: Agentes ondão
# Corre à mão: Actions → "Agentes ondão" → Run workflow.
# O relatório do agente aparece como uma Issue nova no repositório.
on:
  workflow_dispatch:
    inputs:
      agente:
        description: 'Que agente?'
        required: true
        type: choice
        options: [copy, cro, pdp, css, qa, liquid, git]
        default: qa
      tarefa:
        description: 'O que queres que faça? (vazio = revisão habitual)'
        required: false
        default: ''
      modelo:
        description: 'Modelo Gemini'
        required: true
        default: 'gemini-3.8-flash'

permissions:
  contents: read
  issues: write

concurrency:
  group: agentes-${{ inputs.agente }}
  cancel-in-progress: false

jobs:
  agente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install --quiet google-genai

      - name: Correr o agente
        id: correr
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENTE: ${{ inputs.agente }}
          TAREFA: ${{ inputs.tarefa }}
          MODELO: ${{ inputs.modelo }}
        run: python agentes/agente.py

      - name: Publicar relatório como Issue
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTE: ${{ inputs.agente }}
          ESTADO: ${{ steps.correr.outcome }}
        run: |
          if [ "$ESTADO" = "success" ]; then pre="Relatório"; else pre="Falhou"; fi
          [ -s relatorio.md ] || echo "O agente não produziu relatório. Vê o registo em Actions." > relatorio.md
          titulo="[$AGENTE] $pre · $(date -u +'%d/%m %H:%M')"
          cat relatorio.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "$titulo" --body-file relatorio.md
          [ "$ESTADO" = "success" ]
