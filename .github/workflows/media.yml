name: Imagens e vídeos do site

# Quando chega um ficheiro novo a media/entrada/, corta-o para o tamanho certo,
# comprime-o e publica-o em assets/ (o Shopify atualiza o site sozinho).
on:
  push:
    branches: [main]
    paths: ["media/entrada/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Com o segredo GH_PUSH_TOKEN o push sai em nome da sua conta e o Shopify atualiza logo.
          token: ${{ secrets.GH_PUSH_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow pillow-heif
      - name: Processar
        run: python media/ferramentas/processar.py
      - name: Publicar
        run: |
          git config user.name "ondao-media"
          git config user.email "ondao-media@users.noreply.github.com"
          git add -A assets media
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git commit -m "Imagens/vídeos novos publicados no site"
          git pull --rebase origin main
          git push
